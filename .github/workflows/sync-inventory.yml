name: Sync apartment inventory

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run sync:data
        env:
          PLAYWRIGHT_HEADED: "1"

      - name: Commit refreshed inventory
        run: |
          if git diff --quiet -- public/data/inventory.json; then
            echo "Inventory is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/inventory.json
          git commit -m "data: refresh apartment availability"
          git push
